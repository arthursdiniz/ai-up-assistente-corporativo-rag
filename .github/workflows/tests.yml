name: Testes

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar o código
        uses: actions/checkout@v4

      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Instalar dependências
        run: python -m pip install -r requirements.txt

      - name: Executar testes
        run: python -m pytest -q

      - name: Testar navegação por rolagem
        run: node --test tests/scroll_navigation.test.cjs


  postgres-migrations:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: ai_up_test_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://postgres:ci-only-password@localhost:5432/ai_up_test_ci
      TEST_DATABASE_URL: postgresql+psycopg://postgres:ci-only-password@localhost:5432/ai_up_test_ci
      SECRET_KEY: ci-only-session-key-at-least-thirty-two-characters
      LLM_PROVIDER: mock
      EMBEDDING_PROVIDER: hash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -r requirements.txt
      - run: python scripts/check_migrations.py
      - run: python -m pytest -q
