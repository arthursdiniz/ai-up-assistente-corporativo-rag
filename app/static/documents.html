<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Documentos — AI-Up</title><link rel="icon" href="/favicon.svg"><link rel="stylesheet" href="/css/app.css?v=14"></head>
<body class="app-page"><div class="app-shell"><aside class="sidebar compact-sidebar"><a class="wordmark" href="/">AI<span>↑</span>UP</a><nav class="nav-links"><a href="/">Conversas</a><a href="/documents.html">Documentos</a><a id="admin-link" class="hidden" href="/admin.html">Administração</a></nav><div class="user-card"><div class="avatar" id="user-initial">A</div><div><strong id="user-name"></strong><small id="user-role"></small></div><button id="logout" class="icon-button">↗</button></div></aside><main class="workspace content-page"><header class="page-header"><div><p class="section-label">BASE DE CONHECIMENTO</p><h1>Documentos</h1><p>Envie, confira o conteúdo e escolha o que a IA pode consultar.</p></div><button id="upload-button" class="button primary">Enviar arquivos</button><input id="file-input" type="file" accept=".pdf,.txt,.docx,.xlsx,.png,.jpg,.jpeg" multiple hidden></header>
<section class="panel padded"><div id="drop-zone" class="drop-zone">Arraste arquivos para cá ou use “Enviar arquivos”. PDF, TXT, DOCX, XLSX e imagens.</div><p id="upload-progress" role="status"></p><div class="filter-bar"><label>Buscar<input id="document-search" type="search" placeholder="Nome do arquivo"></label><label>Estado<select id="status-filter"><option value="">Todos os estados</option><option value="READY">Pronto</option><option value="PROCESSING">Processando</option><option value="UPLOADED">Na fila</option><option value="ERROR">Com erro</option></select></label><label>Categoria<input id="category-filter" placeholder="Todas"></label><label>Versões<select id="archive-filter"><option value="">Todas</option><option value="active">Ativas</option><option value="archived">Arquivadas</option></select></label></div></section>
<section id="document-list" class="document-grid" aria-live="polite"></section><button id="more-documents" class="button secondary page-more hidden">Carregar mais</button>
<dialog id="delete-document-dialog" class="app-dialog"><div><h2>Excluir documento?</h2><p id="delete-document-copy"></p><div class="dialog-actions"><button data-close="delete-document-dialog" class="button secondary">Cancelar</button><button id="confirm-document-delete" class="button danger-button">Excluir documento</button></div></div></dialog>
<dialog id="category-dialog" class="app-dialog"><form id="category-form"><h2>Organizar documento</h2><label for="category-input">Categoria</label><input id="category-input" required maxlength="80"><div class="dialog-actions"><button type="button" data-close="category-dialog" class="button secondary">Cancelar</button><button class="button primary">Salvar</button></div></form></dialog></main></div><div id="toast" class="toast"></div><script src="/js/api.js?v=12"></script><script src="/js/documents.js?v=10"></script></body></html>
