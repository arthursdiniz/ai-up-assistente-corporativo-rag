<!doctype html>
<html lang="pt-BR">
  <head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Convite — AI-Up</title><link rel="icon" href="/favicon.svg" type="image/svg+xml"><link rel="stylesheet" href="/css/app.css?v=16"></head>
  <body class="auth-page">
    <main class="auth-shell">
      <section class="auth-intro"><a class="wordmark" href="/login.html">AI<span>↑</span>UP</a><p class="eyebrow">BASE DE CONHECIMENTO DA SUA EMPRESA</p><h1>Seu acesso.<br><span>Sua senha.</span></h1><p>O conteúdo permanece no ambiente privado da organização.</p><div class="privacy-pill">● Convite de uso único</div></section>
      <section class="auth-card"><p class="section-label">CONVITE EMPRESARIAL</p><h2 id="invite-title">Validando convite…</h2><p id="invite-description">Aguarde enquanto confirmamos o acesso.</p><form id="invite-form" class="hidden"><label for="invite-email">E-mail</label><input id="invite-email" disabled><label for="invite-name">Seu nome</label><input id="invite-name" minlength="2" maxlength="120" autocomplete="name" required><label for="invite-password">Crie sua senha</label><input id="invite-password" type="password" minlength="10" maxlength="128" autocomplete="new-password" required><p id="invite-error" class="form-error" role="alert"></p><button class="button primary full">Criar conta e entrar</button></form><a id="invite-back" class="button secondary full hidden" href="/login.html">Voltar ao login</a></section>
    </main>
    <script src="/js/invite.js?v=1"></script>
  </body>
